<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OptArena Dashboard</title>
<!-- No external font/CDN requests: the dashboard's privacy claim is "local
     only", so it must not phone out to fonts.googleapis.com on every view.
     Inter/JetBrains Mono are used when installed locally; the system stacks
     below cover every platform otherwise. -->
<style>
/* OptArena dashboard - shared OptArena design language.
   Accent #7C5CFC uniform across themes. Chart series colors validated
   (dataviz six-checks) against the dark surface #0C0C18: blue #3987e5,
   aqua #199e70 - dE 69.8, both >=3:1. Pass/fail always ships icon + label,
   never color alone. */
:root {
  --accent:      #7C5CFC;
  --accent-hover:#6A47F5;
  --accent-soft: rgba(124,92,252,0.12);
  --accent-dim:  rgba(124,92,252,0.20);
  --green:       #22c55e;
  --green-bg:    rgba(34,197,94,0.12);
  --red:         #ef4444;
  --red-bg:      rgba(239,68,68,0.12);
  --bg:          #080810;
  --bg-card:     #0C0C18;
  --bg-elevated: #111124;
  --bg-hover:    #10101E;
  --border:      rgba(255,255,255,0.07);
  --border-hi:   rgba(255,255,255,0.12);
  --text:        #E2E8F0;
  --text-muted:  #8892A4;
  --text-dim:    #4A5568;
  --grid:        #1d1d30;
  --baseline:    #2a2a40;
  --series-a:    #3987e5;   /* categorical slot 1 (validated) */
  --series-b:    #199e70;   /* categorical slot 2 (validated) */
  --mono:        'JetBrains Mono','Fira Code',Consolas,monospace;
  --sans:        'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --radius:      8px;
  --radius-sm:   6px;
  --topbar-bg:   rgba(8,8,16,0.92);
  --shadow:      0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.28);
}
[data-theme="light"]{
  --accent-soft: rgba(124,92,252,0.10);
  --accent-dim:  rgba(124,92,252,0.16);
  --green-bg:    rgba(34,197,94,0.10);
  --red-bg:      rgba(239,68,68,0.10);
  --bg:          #F8F8FC;
  --bg-card:     #FFFFFF;
  --bg-elevated: #F1F1F8;
  --bg-hover:    #F5F5FB;
  --border:      rgba(17,17,34,0.08);
  --border-hi:   rgba(17,17,34,0.14);
  --text:        #14141C;
  --text-muted:  #52526B;
  --text-dim:    #9090A8;
  --grid:        rgba(17,17,34,0.08);
  --baseline:    rgba(17,17,34,0.18);
  --topbar-bg:   rgba(255,255,255,0.92);
  --shadow:      0 1px 2px rgba(17,17,34,.05),0 8px 24px rgba(17,17,34,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}

/* Topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;background:var(--topbar-bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);gap:12px}
.logo-link{display:flex;align-items:center;flex-shrink:0;text-decoration:none}
.wordmark{font-weight:700;font-size:1.35rem;letter-spacing:-0.025em;color:var(--text)}
.wordmark span{color:var(--accent)}
.topbar-sub{color:var(--text-muted);font-size:0.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.topbar-link{font-size:0.875rem;font-weight:500;color:var(--text-muted);padding:5px 10px;border-radius:var(--radius-sm);transition:.15s;white-space:nowrap}
.topbar-link:hover{color:var(--text)}
.theme-btn{background:transparent;border:1px solid var(--border-hi);border-radius:var(--radius-sm);padding:5px 9px;cursor:pointer;color:var(--text-muted);font-size:0.9rem;line-height:1;transition:.15s;display:flex;align-items:center}
.theme-btn:hover{border-color:var(--accent);color:var(--text)}

/* Page */
.page{padding:28px;max-width:1380px;margin:0 auto}
.row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.card{background:var(--bg-card);border:1px solid var(--border-hi);border-radius:var(--radius);padding:20px;flex:1 1 260px;min-width:0}
.card h2{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);font-family:var(--mono);margin-bottom:14px}

/* Stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.tile .label{color:var(--text-dim);font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;font-family:var(--mono);margin-bottom:8px}
.tile .value{font-size:1.65rem;font-weight:700;line-height:1;letter-spacing:-0.02em}
.tile .delta{font-size:0.8rem;margin-top:6px;color:var(--text-muted)}

/* Filters */
.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.filters label{color:var(--text-dim);font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;font-family:var(--mono)}
select{background:var(--bg);border:1px solid var(--border-hi);border-radius:var(--radius);color:var(--text);padding:7px 12px;font-size:0.875rem;font-family:var(--sans);max-width:360px;outline:none;transition:.15s}
[data-theme="light"] select{background:var(--bg-elevated)}
select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* Bars (div-based): <=24px thick, 4px rounded data-end, square baseline,
   2px surface gap between grouped neighbors, hairline baseline. */
.hbar-chart{display:flex;flex-direction:column;gap:10px}
.hbar-row{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:10px;align-items:center}
.hbar-name{color:var(--text-muted);font-size:0.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-track{position:relative;height:20px;border-left:1px solid var(--baseline)}
.hbar{height:16px;margin-top:2px;background:var(--series-a);border-radius:0 4px 4px 0;min-width:2px;position:relative}
.hbar.b{background:var(--series-b)}
.hbar-val{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);color:var(--text);font-size:0.75rem;font-variant-numeric:tabular-nums;white-space:nowrap}
/* Per-step trajectory timeline: one case bar split into segments sized by each
   step's (prompt/turn) duration. inset shadow draws a hairline divider without
   affecting layout; a failed step segment is red. */
.hbar-steps{display:flex;height:16px;margin-top:2px;min-width:2px;position:relative}
.hbar-seg{height:100%;background:var(--series-a);box-shadow:inset -1px 0 0 var(--bg-card)}
.hbar-seg.b{background:var(--series-b)}
.hbar-seg:last-child{border-radius:0 4px 4px 0;box-shadow:none}
.hbar-seg.step-fail{background:var(--red)}
.badge-off{color:var(--red);font-size:0.72rem;font-family:var(--mono);white-space:nowrap}
.sig-yes{color:var(--green)}
.sig-no{color:var(--text-muted)}

.group{margin-bottom:14px}
.group .gname{color:var(--text-muted);font-size:0.82rem;margin-bottom:4px}
.group .pair{display:flex;flex-direction:column;gap:2px}  /* 2px surface gap */

.legend{display:flex;gap:16px;margin:4px 0 14px}
.legend .key{display:flex;gap:6px;align-items:center;color:var(--text-muted);font-size:0.75rem}
.legend .swatch{width:10px;height:10px;border-radius:3px}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:0.875rem}
th{text-align:left;padding:8px 12px;color:var(--text-dim);font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;border-bottom:1px solid var(--border);font-family:var(--mono)}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg-hover)}
[data-theme="light"] tr:hover td{background:var(--bg-elevated)}
.res{font-weight:600}
.res.pass{color:var(--green)}
.res.fail{color:var(--red)}
.fail-detail{color:var(--text-dim);font-size:0.75rem;max-width:380px}

/* Tooltip */
#tip{position:fixed;pointer-events:none;display:none;z-index:200;background:var(--bg-elevated);border:1px solid var(--border-hi);border-radius:var(--radius);padding:8px 12px;font-size:0.75rem;max-width:320px;box-shadow:var(--shadow)}
#tip .t-title{font-weight:600;margin-bottom:3px}
#tip .t-line{color:var(--text-muted)}

.empty{color:var(--text-muted);font-size:0.875rem;padding:24px 0;text-align:center}
code{font-family:var(--mono);font-size:.88em;color:var(--accent);background:var(--accent-soft);padding:1px 5px;border-radius:4px}

/* Footer */
.site-footer{margin-top:60px;padding:36px 28px;border-top:1px solid var(--border);text-align:center}
.site-footer .footer-wordmark{font-weight:700;font-size:1.15rem;letter-spacing:-0.02em;color:var(--text);margin-bottom:14px}
.site-footer .footer-wordmark span{color:var(--accent)}
.site-footer p{font-size:0.875rem;color:var(--text-muted);line-height:1.9}
</style>
</head>
<body>

<div class="topbar">
  <a href="./" class="logo-link" title="OptArena Dashboard">
    <span class="wordmark">Opt<span>Arena</span></span>
  </a>
  <span class="topbar-sub">test &amp; compare AI coding tools - local runs, side-by-side</span>
  <div class="topbar-right">
    <a href="https://github.com/trysti-labs/optarena" class="topbar-link" target="_blank" rel="noopener">GitHub</a>
    <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle light/dark">&#9728;</button>
  </div>
</div>

<div class="page">
  <div id="app"><div class="empty">Loading results&hellip;</div></div>
</div>
<div id="tip"></div>

<footer class="site-footer">
  <div class="footer-wordmark">Opt<span>Arena</span></div>
  <p>Results read from <code>results/index.json</code> &middot;
     new runs: <code>optarena run --driver aider --name my-run</code></p>
  <p>Apache-2.0 &middot; &copy; 2026 Trysti Labs and contributors</p>
</footer>

<script>
"use strict";

/* Theme */
function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
  const next = isDark ? 'light' : 'dark';
  if (next === 'light') document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
  document.getElementById('theme-btn').innerHTML = next === 'light' ? '&#9789;' : '&#9728;';
  try { localStorage.setItem('optarena-theme', next); } catch (e) {}
}
(function initTheme() {
  let saved; try { saved = localStorage.getItem('optarena-theme'); } catch (e) {}
  const preferLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  const theme = saved || (preferLight ? 'light' : 'dark');
  if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
  const btn = document.getElementById('theme-btn');
  if (btn) btn.innerHTML = theme === 'light' ? '&#9789;' : '&#9728;';
})();

const $ = (sel, el) => (el || document).querySelector(sel);
const app = $("#app");
const tip = $("#tip");
// A-08: type-safe - a non-numeric value in a run record must render as escaped
// text, not throw (v.toFixed is not a function) and take the whole view down.
const fmtS = (v) => (typeof v === "number" && isFinite(v))
  ? (v >= 100 ? v.toFixed(0) : v.toFixed(1)) + "s" : (v == null ? "-" : esc(v));
const fmtPct = (v) => (typeof v === "number" && isFinite(v))
  ? Math.round(v * 100) + "%" : (v == null ? "-" : esc(v));
const fmtNum = (v) => (typeof v === "number" && isFinite(v))
  ? v.toLocaleString() : (v == null ? "-" : esc(v));
const fmtUsd = (v) => (typeof v === "number" && isFinite(v)) ? "$" + v.toFixed(2) : "-";
// A-08: a finite number for CSS width math, so a non-numeric field can never
// produce `style="width:NaN%"` (or inject through the style attribute).
const safeNum = (v) => (typeof v === "number" && isFinite(v)) ? v : 0;
const safePct = (v) => Math.max(0, Math.min(1, safeNum(v)));
// A-08: escapes `'` too. Tooltips are assembled into a single-quoted
// data-tip attribute and then re-injected with innerHTML, so an unescaped
// apostrophe could close the attribute early; call sites used to patch that
// up with an ad-hoc .replace(/'/g,...) on the finished string, which is easy
// to forget when adding a new tooltip. Escaping at the source removes the
// footgun entirely.
const esc = (s) => String(s).replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// A-08: every value interpolated into HTML goes through esc() - including
// numbers. `st.i`, token counts and the summary counters are typed as numbers
// by our own writers, but a run record is just JSON on disk (hand-edited, or
// copied from another machine, or written by a future driver), so "it should
// be a number" is not a guarantee the renderer can rely on. num() keeps the
// numeric formatting for real numbers and escapes anything else.
const num = (v, fallback = "-") => (v == null ? fallback
  : (typeof v === "number" && isFinite(v) ? String(v) : esc(v)));

// 95% Wilson CI on a run's pass rate, e.g. " [24%-76%]"; "" when absent.
const ciStr = (s) => (s && s.pass_rate_ci)
  ? ` [${fmtPct(s.pass_rate_ci[0])}–${fmtPct(s.pass_rate_ci[1])}]` : "";

// Mirror of compare.mcnemar_exact_p: two-sided exact paired significance of an
// A/B accuracy delta from the discordant (flipped) case counts.
function comb(n, k) {
  if (k < 0 || k > n) return 0;
  k = Math.min(k, n - k);
  let r = 1;
  for (let i = 0; i < k; i++) r = r * (n - i) / (i + 1);
  return r;
}
function mcnemarExactP(regressed, improved) {
  const n = regressed + improved;
  if (n === 0) return 1.0;
  const k = Math.min(regressed, improved);
  let tail = 0;
  for (let i = 0; i <= k; i++) tail += comb(n, i);
  return Math.min(1.0, 2 * tail * Math.pow(0.5, n));
}

// Mirror of metrics.case_trajectory: a case's trajectory dict, single-run or
// (--trials) last-trial. {} when absent.
function trajOf(c) {
  const ex = c.extra || {};
  if (ex.oracle && ex.oracle.trajectory) return ex.oracle.trajectory;
  const all = ex.oracle_all_trials || [];
  for (let i = all.length - 1; i >= 0; i--) if (all[i] && all[i].trajectory) return all[i].trajectory;
  return {};
}

// Mirror of metrics.attribute_failure (Tier 3): for a FAILED case with
// per-step records, a one-line "where did it go wrong" - preferring the
// precise `oracle_ok` (real check_command-backed verdict, only present for
// disruption cases) over the cheap `expected_ok` fallback. null when there's
// nothing to attribute (passed, or fewer than two steps).
function attributeFailure(c) {
  if (c.passed) return null;
  const steps = (c.extra && c.extra.steps) || [];
  if (steps.length < 2) return null;
  const precise = steps.some((st) => "oracle_ok" in st);
  const key = precise ? "oracle_ok" : "expected_ok";
  const verb = precise ? "the case's real oracle (behavior) passed" : "expected files satisfied";
  const okSteps = steps.filter((st) => st[key]).map((st) => st.i);
  const lastOk = okSteps.length ? Math.max(...okSteps) : null;
  const lastI = steps[steps.length - 1].i;
  if (lastOk !== null && lastOk < lastI) {
    const after = steps.find((st) => st.i === lastOk) || {};
    const disrupted = after.disrupted;
    const why = disrupted && disrupted.length ? ` (disruption fired here: ${disrupted[0]})` : "";
    return `${verb} after prompt ${lastOk}, regressed by prompt ${lastI}${why}`;
  }
  const firstBad = steps.find((st) => st.ok === false);
  if (firstBad) return `tool reported failure at prompt ${firstBad.i}`;
  if (lastOk === null) {
    return precise ? "the case's real oracle never passed at any prompt"
                    : "expected files were never satisfied by any prompt";
  }
  return null;
}

let INDEX = [];               // results/index.json entries (newest first)
const RUN_CACHE = {};         // file -> full run record

async function fetchJSON(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
  return r.json();
}
async function loadRun(entry) {
  if (!RUN_CACHE[entry.file]) RUN_CACHE[entry.file] = await fetchJSON("../results/" + entry.file);
  return RUN_CACHE[entry.file];
}

/* Tooltip */
function bindTips(root) {
  root.querySelectorAll("[data-tip]").forEach((el) => {
    el.addEventListener("mousemove", (e) => {
      tip.innerHTML = el.dataset.tip;
      tip.style.display = "block";
      const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
      tip.style.left = Math.min(e.clientX + pad, innerWidth - w - 8) + "px";
      tip.style.top = Math.min(e.clientY + pad, innerHeight - h - 8) + "px";
    });
    el.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  });
}

/* Views */
function tilesHTML(run) {
  const s = run.summary || {};
  const b = (run.scenario || {}).backend || {};
  return `<div class="tiles">
    <div class="tile"><div class="label">Pass rate</div>
      <div class="value">${fmtPct(s.pass_rate)}</div>
      <div class="delta">${num(s.passed, "?")}/${num(s.cases, "?")} cases${s.pass_rate_ci ? " · 95% CI" + ciStr(s) : ""}</div></div>
    <div class="tile"><div class="label">Clean passes</div>
      <div class="value">${s.clean_passes != null ? num(s.clean_passes) + "/" + num(s.cases) : "-"}</div>
      <div class="delta">${s.clean_passes != null
          ? (s.off_target_edits ? num(s.off_target_edits) + " off-target edit(s)" : "no off-target edits")
            + (s.mean_steps != null ? " · " + num(s.mean_steps) + " steps/case" : "")
          : "passed with no off-target edits / clean exit"}</div></div>
    <div class="tile"><div class="label">Mean case time</div>
      <div class="value">${fmtS(s.mean_duration_s)}</div>
      <div class="delta">total ${fmtS(s.total_duration_s)}</div></div>
    <div class="tile"><div class="label">Driver</div>
      <div class="value" style="font-size:1.1rem">${esc((run.scenario || {}).driver || "")}</div>
      <div class="delta">${esc(b.model || "")} @ ${esc(String(b.base_url || "").replace(/^https?:\/\//, ""))}</div></div>
    <div class="tile"><div class="label">Cost / efficiency</div>
      <div class="value">${s.total_cost_usd != null ? fmtUsd(s.total_cost_usd) : "-"}</div>
      <div class="delta">${s.total_tokens
          ? fmtNum(s.total_tokens) + " tokens" + (s.tokens_per_pass ? " · " + fmtNum(s.tokens_per_pass) + "/pass" : "")
          : "no cost/token telemetry reported"}</div></div>
    <div class="tile"><div class="label">Files changed</div>
      <div class="value">${num(s.mean_files_changed)}</div>
      <div class="delta">mean per case</div></div>
  </div>`;
}

function passRateChartHTML() {
  const rows = INDEX.slice(0, 12).map((r) => {
    const pct = (r.summary && r.summary.pass_rate || 0);
    const t = `<div class="t-title">${esc(r.scenario)}</div>
       <div class="t-line">driver ${esc(r.driver)} &middot; model ${esc((r.backend||{}).model||"")}</div>
       <div class="t-line">${num((r.summary||{}).passed, "?")}/${num((r.summary||{}).cases, "?")} passed &middot; mean ${fmtS((r.summary||{}).mean_duration_s)}</div>`;
    // A-08: esc() now covers `'`, so no per-site quote patching is needed.
    return `<div class="hbar-row">
      <div class="hbar-name" title="${esc(r.run_id)}">${esc(r.scenario)}</div>
      <div class="hbar-track"><div class="hbar" data-tip='${t}'
        style="width:${Math.max(1, safePct(pct) * 100)}%"><span class="hbar-val">${fmtPct(pct)}</span></div></div>
    </div>`;
  }).join("");
  return `<div class="hbar-chart">${rows}</div>`;
}

/**
 * Mirror of compare.manifest_compatibility (M-03): two runs only support an
 * overall faster/more-accurate/cheaper verdict when they measured the SAME
 * thing - same oracle version, same resolved case set, same trial count.
 * Returns {comparable, verified, reasons}.
 */
function manifestCompatibility(manA, manB) {
  if (!manA || !manB) {
    return { comparable: true, verified: false,
      reasons: ["one or both runs predate run manifests - comparability could not be verified"] };
  }
  const reasons = [];
  if (manA.oracle_version !== manB.oracle_version) {
    reasons.push(`different oracle version (${manA.oracle_version} vs ${manB.oracle_version})`);
  }
  if (manA.case_set_hash !== manB.case_set_hash) {
    reasons.push(`different case set (${manA.case_count} case(s) hash ${manA.case_set_hash} vs ${manB.case_count} case(s) hash ${manB.case_set_hash})`);
  }
  if (manA.trials !== manB.trials) {
    reasons.push(`different trial count (${manA.trials} vs ${manB.trials})`);
  }
  return { comparable: reasons.length === 0, verified: true, reasons };
}

function compareHTML(runA, runB) {
  const cases = {};
  for (const c of runA.cases) (cases[c.name] = cases[c.name] || {}).a = c;
  for (const c of runB.cases) (cases[c.name] = cases[c.name] || {}).b = c;
  const names = Object.keys(cases).sort();
  const maxDur = Math.max(1, ...names.flatMap((n) =>
    [cases[n].a, cases[n].b].filter(Boolean).map((c) => c.duration_s || 0)));

  const labelA = runA.scenario.name, labelB = runB.scenario.name;
  const bar = (c, cls, label) => {
    if (!c) return `<div class="hbar-track"></div>`;
    const traj = trajOf(c);
    const steps = (c.extra && c.extra.steps) || [];
    const offNote = traj.off_target_count ? ` &middot; off-target: ${traj.off_target_count}` : "";
    const stepLine = steps.length
      ? `<div class="t-line">${steps.length} step(s): ${steps.map((st) =>
          `#${num(st.i, "?")} ${fmtS(st.duration_s)}${st.ok === false ? " &#10007;" : ""}${st.expected_ok === false ? " (unmet)" : ""}` +
          (st.completion_tokens != null ? " " + num(st.completion_tokens) + "t" : "")).join(" &middot; ")}</div>`
      : "";
    // Dynamic eval: note any mid-session disruptions that fired for this case.
    const fired = steps.flatMap((st) => st.disrupted || []);
    const disruptLine = fired.length
      ? `<div class="t-line" style="color:var(--accent)">⚡ disruption: ${esc(fired.join("; "))}</div>` : "";
    const why = attributeFailure(c);
    const attribLine = why ? `<div class="t-line">↳ ${esc(why)}</div>` : "";
    const t = `<div class="t-title">${esc(c.name)} - ${esc(label)}</div>
      <div class="t-line">${c.passed ? "&#10003; passed" : "&#10007; " + esc(((c.failures || [])[0] || c.error || "failed"))}</div>
      <div class="t-line">${fmtS(c.duration_s)}${offNote} &middot; files: ${esc((c.files || []).join(", ") || "none")}</div>${stepLine}${disruptLine}${attribLine}`;
    const tipAttr = t;   // A-08: esc() escapes `'`, so no patch-up pass here
    const wPct = Math.max(1, safeNum(c.duration_s) / maxDur * 88);
    // Per-step timeline: split the bar into segments sized by each step's share
    // of the total step time (only when >1 step is recorded, i.e. a
    // multi-prompt case; a driver that caches results records no steps).
    if (steps.length > 1) {
      const tot = steps.reduce((a, st) => a + (st.duration_s || 0), 0) || 1;
      const segs = steps.map((st) =>
        `<div class="hbar-seg ${cls} ${st.ok === false ? "step-fail" : ""}"
          style="width:${Math.max(2, (st.duration_s || 0) / tot * 100)}%"></div>`).join("");
      return `<div class="hbar-track"><div class="hbar-steps" data-tip='${tipAttr}' style="width:${wPct}%">
        ${segs}<span class="hbar-val">${fmtS(c.duration_s)}${c.passed ? "" : " &#10007;"}</span></div></div>`;
    }
    return `<div class="hbar-track"><div class="hbar ${cls}" data-tip='${tipAttr}'
      style="width:${wPct}%">
      <span class="hbar-val">${fmtS(c.duration_s)}${c.passed ? "" : " &#10007;"}</span></div></div>`;
  };

  const groups = names.map((n) => `<div class="group">
      <div class="gname">${esc(n)}</div>
      <div class="pair">${bar(cases[n].a, "", labelA)}${bar(cases[n].b, "b", labelB)}</div>
    </div>`).join("");

  const res = (c) => c == null ? "<td>-</td>"
    : `<td class="res ${c.passed ? "pass" : "fail"}">${c.passed ? "&#10003; pass" : "&#10007; fail"}</td>`;
  const failNote = (c) => c && !c.passed
    ? `<div class="fail-detail">${esc(((c.failures || [])[0] || c.error || ""))}</div>` : "";
  // Off-target-edit badge: files the agent changed that the task never asked for
  // (a "did it stay on task" signal, flagged even when the case passed).
  const offBadge = (c, side) => {
    const n = c ? (trajOf(c).off_target_count || 0) : 0;
    return n ? ` <span class="badge-off" title="${esc(side)}: ${esc((trajOf(c).off_target_files || []).join(", "))}">&#9888; ${n} off-target</span>` : "";
  };
  const tableRows = names.map((n) => {
    const a = cases[n].a, b2 = cases[n].b;
    const delta = a && b2 && a.duration_s != null && b2.duration_s != null
      ? (b2.duration_s - a.duration_s) : null;
    return `<tr><td>${esc(n)}${offBadge(a, "A")}${offBadge(b2, "B")}${failNote(a)}${failNote(b2)}</td>${res(a)}${res(b2)}
      <td>${fmtS(a && a.duration_s)}</td><td>${fmtS(b2 && b2.duration_s)}</td>
      <td>${delta == null ? "-" : (delta > 0 ? "+" : "") + delta.toFixed(1) + "s"}</td></tr>`;
  }).join("");

  const sa = runA.summary, sb = runB.summary;
  const accA = sa.pass_rate, accB = sb.pass_rate;

  // Paired significance of the accuracy delta (exact McNemar on flipped cases).
  let reg = 0, imp = 0;
  for (const n of names) {
    const a = cases[n].a, b = cases[n].b;
    if (a && b) {
      if (a.passed && !b.passed) reg++;
      else if (!a.passed && b.passed) imp++;
    }
  }
  const nDisc = reg + imp;
  const pVal = mcnemarExactP(reg, imp);
  const sigHTML = (nDisc > 0 && accA !== accB)
    ? (pVal < 0.05
        ? `<span class="sig-yes">significant</span> (p=${pVal.toFixed(3)}, ${nDisc} flipped)`
        : `<span class="sig-no">likely noise</span> (p=${pVal.toFixed(3)}, ${nDisc} flipped)`)
    : `${nDisc} case(s) flipped`;

  // M-03: suppress the aggregate winner tiles when the two runs did not
  // measure the same thing (different case set / oracle / trial count) -
  // the per-case table below stays, since it aligns by shared case name.
  const compat = manifestCompatibility(runA.manifest, runB.manifest);
  const suppressed = compat.comparable === false;
  const compatBanner = compat.reasons.length
    ? `<div class="empty" style="text-align:left;padding:10px 0;color:var(--red)">
        <b>${suppressed ? "Not directly comparable" : "Comparability unverified"}</b> -
        ${compat.reasons.map(esc).join("; ")}${suppressed ? ". Overall winner tiles suppressed; per-case rows below cover shared cases only." : ""}
      </div>` : "";

  // H-07: a missing total_cost_usd means "no cost data reported", which must
  // never be coerced to $0.00 and win. A verdict needs BOTH sides known.
  const fmtCost = (v) => v == null ? "-" : "$" + v.toFixed(2);
  const bothCosts = sa.total_cost_usd != null && sb.total_cost_usd != null;
  const cheaperVal = suppressed ? "(suppressed)"
    : !bothCosts ? "unknown"
    : esc(sa.total_cost_usd <= sb.total_cost_usd ? labelA : labelB);
  const cheaperNote = !bothCosts && !suppressed
    ? "no cost data for one or both runs"
    : `${fmtCost(sa.total_cost_usd)} vs ${fmtCost(sb.total_cost_usd)}`;

  const verdict = `${compatBanner}<div class="tiles" style="margin-bottom:14px">
    <div class="tile"><div class="label">More accurate</div>
      <div class="value" style="font-size:1.05rem">${suppressed ? "(suppressed)" : (accA === accB ? "tie" : esc(accA > accB ? labelA : labelB))}</div>
      <div class="delta">${fmtPct(accA)}${ciStr(sa)} vs ${fmtPct(accB)}${ciStr(sb)}</div></div>
    <div class="tile"><div class="label">Pass-rate delta (B - A)</div>
      <div class="value" style="font-size:1.05rem">${(accB - accA >= 0 ? "+" : "") + Math.round((accB - accA) * 100)}pp</div>
      <div class="delta">${suppressed ? "&nbsp;" : sigHTML}</div></div>
    <div class="tile"><div class="label">Clean passes (A vs B)</div>
      <div class="value" style="font-size:1.05rem">${sa.clean_passes != null ? sa.clean_passes : "-"} vs ${sb.clean_passes != null ? sb.clean_passes : "-"}</div>
      <div class="delta">${(sa.off_target_edits || 0) + (sb.off_target_edits || 0)} off-target edit(s) total</div></div>
    <div class="tile"><div class="label">Faster (mean case)</div>
      <div class="value" style="font-size:1.05rem">${suppressed ? "(suppressed)" : esc(sa.mean_duration_s <= sb.mean_duration_s ? labelA : labelB)}</div>
      <div class="delta">${fmtS(sa.mean_duration_s)} vs ${fmtS(sb.mean_duration_s)}</div></div>
    <div class="tile"><div class="label">Cheaper</div>
      <div class="value" style="font-size:1.05rem">${cheaperVal}</div>
      <div class="delta">${cheaperNote}</div></div>
    <div class="tile"><div class="label">Tokens (A vs B)</div>
      <div class="value" style="font-size:1.05rem">${sa.total_tokens ? sa.total_tokens.toLocaleString() : "-"} vs ${sb.total_tokens ? sb.total_tokens.toLocaleString() : "-"}</div>
      <div class="delta">${sa.total_tokens && sb.total_tokens ? ((sb.total_tokens - sa.total_tokens >= 0 ? "+" : "") + (sb.total_tokens - sa.total_tokens).toLocaleString() + " B - A") : "where the backend reports usage"}</div></div>
  </div>`;

  return `${verdict}
    <div class="legend">
      <span class="key"><span class="swatch" style="background:var(--series-a)"></span>${esc(labelA)}</span>
      <span class="key"><span class="swatch" style="background:var(--series-b)"></span>${esc(labelB)}</span>
      <span class="key" style="color:var(--text-dim)">bars split into per-step (per-turn) segments where the driver records them; hover for timing/tokens</span>
    </div>
    ${groups}
    <h2 style="margin-top:18px">Per-case results</h2>
    <table>
      <thead><tr><th>case</th><th>A result</th><th>B result</th><th>A time</th><th>B time</th><th>&Delta; time</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table>`;
}

function trendHTML(scenarioName) {
  const hist = INDEX.filter((r) => r.scenario === scenarioName).slice(0, 10).reverse();
  if (hist.length < 2) {
    return `<div class="empty">Run the <b>${esc(scenarioName)}</b> scenario again to see its trend.</div>`;
  }
  const rows = hist.map((r) => {
    const s = r.summary || {};
    const pct = s.pass_rate || 0;
    const t = `<div class="t-title">${esc(r.run_id)}</div>
       <div class="t-line">${num(s.passed, "?")}/${num(s.cases, "?")} passed &middot; mean ${fmtS(s.mean_duration_s)}</div>`;
    const shortId = String(r.run_id).slice(0, 15);
    return `<div class="hbar-row">
      <div class="hbar-name" title="${esc(r.run_id)}">${esc(shortId)}</div>
      <div class="hbar-track"><div class="hbar" data-tip='${t}'
        style="width:${Math.max(1, safePct(pct) * 100)}%"><span class="hbar-val">${fmtPct(pct)} &middot; ${fmtS(s.mean_duration_s)}</span></div></div>
    </div>`;
  }).join("");
  return `<div class="hbar-chart">${rows}</div>`;
}

/* Page assembly */
async function render() {
  const selA = $("#selA") ? $("#selA").value : (INDEX[1] ? 1 : 0);
  const selB = $("#selB") ? $("#selB").value : 0;

  const options = (sel) => INDEX.map((r, i) =>
    `<option value="${i}" ${String(i) === String(sel) ? "selected" : ""}>${esc(r.scenario)} &middot; ${esc(r.run_id)}</option>`).join("");

  const iA = Math.min(Number(selA) || 0, INDEX.length - 1);
  const iB = Math.min(Number(selB) || 0, INDEX.length - 1);
  const [runA, runB] = await Promise.all([loadRun(INDEX[iA]), loadRun(INDEX[iB])]);

  app.innerHTML = `
    <div class="row">
      <div class="filters card" style="flex:1 1 100%">
        <label>Run A</label><select id="selA">${options(iA)}</select>
        <label>Run B</label><select id="selB">${options(iB)}</select>
        <span style="color:var(--text-dim);font-size:0.75rem">pick two runs to compare - latest first</span>
      </div>
    </div>
    <div class="row">
      <div class="card" style="flex:1 1 420px"><h2>Run A - ${esc(runA.scenario.name)}</h2>${tilesHTML(runA)}</div>
      <div class="card" style="flex:1 1 420px"><h2>Run B - ${esc(runB.scenario.name)}</h2>${tilesHTML(runB)}</div>
    </div>
    <div class="row">
      <div class="card" style="flex:2 1 520px"><h2>Compare - per-case duration &amp; results</h2>
        ${iA === iB ? '<div class="empty">Run A and Run B are the same run - pick a different Run B.</div>' : compareHTML(runA, runB)}
      </div>
      <div class="card" style="flex:1 1 320px"><h2>Pass rate by run</h2>${passRateChartHTML()}
        <h2 style="margin-top:18px">Trend - ${esc(runA.scenario.name)} (oldest to newest)</h2>${trendHTML(runA.scenario.name)}</div>
    </div>`;

  $("#selA").addEventListener("change", render);
  $("#selB").addEventListener("change", render);
  bindTips(app);
}

(async function init() {
  try {
    INDEX = await fetchJSON("../results/index.json");
  } catch (e) {
    app.innerHTML = `<div class="card"><div class="empty">
      No results yet (${esc(e.message)}).<br><br>
      Run a scenario first, e.g. <code>optarena run --driver ollama-chat --name baseline</code>,
      then serve this dashboard with <code>optarena serve</code>.</div></div>`;
    return;
  }
  if (!INDEX.length) {
    app.innerHTML = `<div class="card"><div class="empty">results/index.json is empty - run a scenario first.</div></div>`;
    return;
  }
  // Default: A = second-newest, B = newest (a natural before/after compare).
  await render();
})();
</script>
</body>
</html>
