[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optarena"
version = "0.1.0"
description = "Local-first testing & comparison framework for AI coding tools (CLI agents, SDK agents, raw-model baselines) against any OpenAI/Ollama-compatible backend."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
]
# The core is intentionally dependency-free (stdlib only).
dependencies = []

[project.optional-dependencies]
crewai = ["crewai>=0.80"]
openai-agents = ["openai-agents"]
smolagents = ["smolagents"]
langgraph = ["langgraph", "langchain-openai"]
autogen = ["autogen-agentchat", "autogen-ext[openai]"]
semantic-kernel = ["semantic-kernel"]

[project.scripts]
optarena = "optarena.cli:main_exit"

[tool.setuptools.packages.find]
where = ["."]
include = ["optarena*"]

[tool.setuptools.package-data]
optarena = ["cases/*.json"]

# Intentionally NOT bundled: docker/, dashboard/, repos/ - all
# top-level siblings of optarena/, not part of this package. This is a
# source-checkout tool, not a wheel with everything embedded - see the
# "Source-checkout install only" note in README.md before changing this.

[tool.ruff.lint]
# Explicit rather than "whatever ruff's current default happens to be" -
# ruff 0.16.0 (2026-07-26) expanded its own defaults and silently broke the
# unpinned `pip install ruff` CI lint gate with 61 new findings across
# pre-existing code, none related to any actual change. Pinning the
# selection here (matching ruff's pre-0.16 defaults) keeps the gate stable
# across ruff upgrades; adopting a stricter ruleset should be a deliberate
# choice with its own cleanup pass, not an upstream surprise.
select = ["E4", "E7", "E9", "F"]
