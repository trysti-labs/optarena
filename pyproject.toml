[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optarena"
version = "0.1.0"
description = "Local-first testing & comparison framework for AI coding tools (CLI agents, SDK agents, raw-model baselines) against any OpenAI/Ollama-compatible backend."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
]
# The core is intentionally dependency-free (stdlib only).
dependencies = []

[project.optional-dependencies]
crewai = ["crewai>=0.80"]
openai-agents = ["openai-agents"]
smolagents = ["smolagents"]
langgraph = ["langgraph", "langchain-openai"]
autogen = ["autogen-agentchat", "autogen-ext[openai]"]
semantic-kernel = ["semantic-kernel"]
# CI/dev tooling only - never a runtime dependency of the package itself.
# pytest runs the same unittest.TestCase suite `python -m unittest` always
# has (no rewrite needed); pytest-randomly randomizes test order so shared
# mutable state (e.g. a leaked temp dir, a module-level mock that only
# passes because of file order) fails loudly instead of hiding until
# something else runs first; pytest-cov measures/enforces coverage.
test = ["pytest>=8", "pytest-cov>=5", "pytest-randomly>=3"]

[project.scripts]
optarena = "optarena.cli:main_exit"

[tool.setuptools.packages.find]
where = ["."]
include = ["optarena*"]

[tool.setuptools.package-data]
optarena = ["cases/*.json"]

# Intentionally NOT bundled: docker/, dashboard/, repos/ - all
# top-level siblings of optarena/, not part of this package. This is a
# source-checkout tool, not a wheel with everything embedded - see the
# "Source-checkout install only" note in README.md before changing this.

[tool.coverage.run]
source = ["optarena"]
branch = true
omit = ["optarena/__main__.py"]

[tool.coverage.report]
# The 6 optional SDK-driver wrapper modules (crewai_sdk.py, langgraph_sdk.py,
# etc.) score 28-38% in CI, because their whole SDK-specific code path is
# only reachable with the real third-party package installed, which CI does
# not install for any of them (the same reason those extras are optional at
# all). Real baseline measured 2026-08-02: 77% branch coverage repo-wide.
# Gated a few points below that (not at it) so this is a regression trip
# wire, not a fragile pass/fail hinging on incidental cross-platform
# variance between the OS this was measured on and whichever runs it in CI.
fail_under = 75
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff.lint]
# Explicit rather than "whatever ruff's current default happens to be" -
# ruff 0.16.0 (2026-07-26) expanded its own defaults and silently broke the
# unpinned `pip install ruff` CI lint gate with 61 new findings across
# pre-existing code, none related to any actual change. Pinning the
# selection here (matching ruff's pre-0.16 defaults) keeps the gate stable
# across ruff upgrades; adopting a stricter ruleset should be a deliberate
# choice with its own cleanup pass, not an upstream surprise.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy's Mapped["Task"]/Mapped["Project"]/Mapped["User"] forward refs
# form a genuine 3-way circular relationship across sibling model files,
# resolved at runtime by SQLAlchemy's mapper registry against the shared
# Base - not by Python's import system. ruff's F821 can't see that
# resolution path (it would need SQLAlchemy-plugin-level type awareness,
# the way mypy's sqlalchemy plugin does), so it flags every cross-file
# forward ref as undefined even though the app runs and is tested. Scoped
# to exactly the three files with this pattern, not the whole fixture.
"repos/fastapi-tasktracker/app/models/*.py" = ["F821"]
