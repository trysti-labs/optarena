name: ci

on:
  push:
    branches: [main, v0.1]
  pull_request:

# A push to an open PR previously left the superseded run's ~9 jobs (several
# 15-40 minutes, Docker-heavy) running to completion alongside the new one -
# pure wasted runner time on a result nobody will read. Scoped per-workflow-
# per-ref so unrelated branches/PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every job below got an explicit timeout-minutes this session - none had
  # one before, so a hang (a container that stops responding, a deadlocked
  # test - exactly the failure mode that surfaced the sandbox-concurrency
  # bug below) would otherwise run up to GitHub's 360-minute default before
  # failing, burning Actions minutes for hours instead of failing fast.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.15.22
      - name: Ruff (lint gate)
        run: ruff check optarena tests

  # OS/Python matrix, and deliberately NO `python`-is-python3 shim: this is the
  # exact environment class the audit's original 5/75 failure lived in (a host
  # with python3 but no bare `python`). Catches that regression class plus
  # macOS/Windows host-fallback portability. Tests run without Docker.
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # F-17: pyproject.toml declares `requires-python = ">=3.10"` (lower
        # bound only) but the matrix stopped at 3.12, so nothing tested the
        # supported-in-principle 3.13+ range.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      # Node present so the cross-oracle conformance suite
      # (tests/test_conformance.py) RUNS rather than skipping: the dashboard
      # reimplements four algorithms in JS (mcnemar_exact_p,
      # manifest_compatibility, case_trajectory, attribute_failure) and that
      # suite asserts they still agree with the Python. A-35: this step used to
      # claim the suite existed when the file did not - it does now, and it is
      # mutation-checked (perturbing the JS makes it fail).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      # pytest, not bare `python -m unittest discover`: same test suite
      # (pytest runs unittest.TestCase classes natively, no rewrite), but it
      # unlocks two things unittest can't do - pytest-randomly (below) and
      # coverage measurement/enforcement. CI-only tooling, not a runtime
      # dependency of the package (see the `test` extra's own comment).
      - name: Install test tooling
        run: pip install -e .[test]
      # pytest-randomly (auto-loads once installed, no flag needed) runs the
      # suite in a different order every invocation and prints the seed it
      # used on failure - the same class of bug a 2026-08-02 sweep found by
      # hand (~35 tempfile.mkdtemp() sites with no addCleanup, several
      # `tearDown()`s that only restored mocked module state) is exactly what
      # order-dependence catches automatically going forward instead of
      # needing another manual audit.
      # Coverage on every leg, one run (not a second full test pass just to
      # add --cov) - so a Windows- or macOS-only code path (this project has
      # real ones, e.g. cases.py's _kill_process_tree taskkill-vs-killpg
      # branch) isn't silently invisible on the legs that don't exercise it.
      # fail_under lives in pyproject.toml's [tool.coverage.report] (75%,
      # ~2pp below the 77% measured baseline - a regression trip wire, not a
      # fragile exact-match gate) and applies uniformly across the matrix;
      # XML export + the uploaded artifact are limited to one canonical leg
      # since combining coverage.py data correctly across a 12-way matrix
      # needs its own combine step, and 12 near-duplicate artifacts add
      # nothing --term-missing in the log doesn't already show.
      - name: Unit tests + coverage (no Docker)
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.python-version }}" = "3.11" ]; then
            OPTARENA_DISABLE_SANDBOX=1 python -m pytest tests/ -v --cov=optarena --cov-branch --cov-report=xml --cov-report=term-missing
          else
            OPTARENA_DISABLE_SANDBOX=1 python -m pytest tests/ -v --cov=optarena --cov-branch --cov-report=term-missing
          fi
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # Corpus self-verification: every case's reference_solution must PASS the
  # real container-sandboxed oracle, every broken/unmodified variant must FAIL.
  # Runs when cases or the oracle change; images come from GHCR via the
  # tool's own pull fallback. Skipped on forks (no image pull access needed,
  # but keeps PR checks fast).
  #
  # A real bug lived here: verify_cases() used to start a sandbox for every
  # distinct image the corpus needs (9, one per language) SIMULTANEOUSLY,
  # each `--memory 2g --cpus 2` - 18 CPU/18GiB requested at once against
  # this job's 2-vCPU/7GiB runner (both remotes are private repos, confirmed
  # via the GitHub API), even though only one sandbox is ever used at a
  # time. That reliably produced "Permission denied"/"No such container"
  # failures under real load - confirmed by re-running the exact failing
  # cases in isolation, where they passed cleanly. Fixed by grouping cases
  # by image and keeping only one sandbox alive at a time (still one
  # container per image group, not one per check_command - the original
  # optimization is unaffected); pinned by
  # VerifyCorpusSandboxConcurrencyTests in the unit suite. One retry here is
  # defense-in-depth against genuine one-off infra flakes (a GHCR hiccup, a
  # noisy runner) - NOT a substitute for that fix, since a real
  # resource-exhaustion regression would fail both attempts identically.
  verify-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.repository_owner == 'trysti-labs' || github.repository_owner == 'selfopt'
    needs: unit-tests
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # The sandbox images live on GHCR; login lets the tool's own pull
      # fallback fetch them even while the packages are private.
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify corpus (pulls sandbox images from GHCR on demand)
        run: |
          for attempt in 1 2; do
            if python -m optarena cases verify; then
              exit 0
            fi
            echo "::warning::verify-corpus attempt $attempt failed"
            sleep 10
          done
          exit 1

  # Fast multi-image regression check: verify-corpus (above) is the only job
  # that exercises switching between two DIFFERENT sandbox images, but it's
  # slow (full 510-case corpus) - a sandbox-switching regression only shows
  # up after that whole run. This scopes to exactly 2 cases needing 2
  # different images (one base-image Python case, one Rust case; both
  # hand-verified against real Docker this session), so it gives the same
  # class of signal in well under a minute.
  multi-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository_owner == 'trysti-labs' || github.repository_owner == 'selfopt'
    needs: unit-tests
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify a base-image case and a Rust-image case together
        run: python -m optarena cases verify --cases adapt_config_change_dynamic,adapt_compounding_config_rust_dynamic

  # F-17: nothing previously exercised the actual DISTRIBUTION artifact - the
  # unit-tests job runs against a checkout (`python -m unittest`), which
  # can't catch a packaging bug (a file missing from `package-data`, an entry
  # point that doesn't resolve) that only shows up once a wheel is built and
  # installed standalone into a clean environment.
  wheel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Embed build commit (P2-02)
        run: python scripts/embed_build_commit.py
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist
      - name: Install wheel into a clean venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
      # A-30: run from OUTSIDE the checkout, or the repo shadows the installed
      # package on sys.path and this tests the source tree instead of the wheel.
      - name: Smoke-test the installed CLI
        working-directory: /tmp
        run: |
          /tmp/wheel-venv/bin/optarena --help
          /tmp/wheel-venv/bin/optarena --version
          /tmp/wheel-venv/bin/optarena cases validate
          /tmp/wheel-venv/bin/optarena doctor --json > /tmp/doctor.json || true
          python -c "import json; json.load(open('/tmp/doctor.json'))"
      # A-30: the results directory must NOT land inside site-packages, where
      # `pip install -U` would be entitled to delete a user's run history. The
      # old smoke test only ran --help/cases validate, neither of which
      # touches that path, so this went unnoticed.
      - name: Results directory is outside site-packages
        working-directory: /tmp
        run: |
          /tmp/wheel-venv/bin/python - <<'PY'
          from optarena import store
          location = str(store.RESULTS_DIR)
          print("results dir:", location)
          assert "site-packages" not in location, location
          PY
      # A-26: features that need the unpackaged directories must fail with a
      # clear message, not a traceback or a silently degraded mode.
      - name: Unpackaged assets fail cleanly
        working-directory: /tmp
        run: |
          set +e
          out=$(/tmp/wheel-venv/bin/optarena serve --port 8399 2>&1); code=$?
          set -e
          echo "$out"
          test "$code" = "2"
          echo "$out" | grep -q "no dashboard"
      # P2-02: the wheel carries no .git directory at all, so a manifest
      # built from it must fall back to the commit scripts/embed_build_commit.py
      # wrote into the package - proving that fallback actually fires from a
      # REAL installed wheel, not just a unit test that mocks the file read.
      - name: Installed wheel reports its embedded build commit
        working-directory: /tmp
        run: |
          expected=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)
          /tmp/wheel-venv/bin/python - "$expected" <<'PY'
          import sys
          from optarena.runner._manifest import _source_revision
          expected = sys.argv[1]
          info = _source_revision()
          print("source revision from installed wheel:", info)
          assert info["git_commit"] == expected, (info["git_commit"], expected)
          assert info["git_dirty"] is None, info["git_dirty"]
          PY

  # A-36: the non-root sandbox opt-in (OPTARENA_SANDBOX_USER), exercised on
  # real Linux - the only place it can actually be validated. On Windows and
  # macOS the Docker Desktop bind-mount layer ignores Unix permission bits, so
  # a local pass there proves nothing about whether an unprivileged uid can
  # write the workspace; that is the same blind spot that hid the DAC_OVERRIDE
  # failure for months. Scoped to the base image's shell track to stay fast:
  # what this guards is that the account exists, its HOME is writable, the
  # toolchain caches are readable, and the runner's workspace-permission
  # relaxation is enough for a case to actually run and be graded.
  sandbox-nonroot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository_owner == 'trysti-labs' || github.repository_owner == 'selfopt'
    needs: unit-tests
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built here rather than pulled: the published :latest predates the
      # non-root account, so pulling it would test the old image.
      - name: Build the base sandbox image
        run: docker build -t optarena-tester:latest -f docker/Dockerfile docker
      - name: Verify shell cases as a non-root sandbox user
        env:
          OPTARENA_SANDBOX_USER: "1000:1000"
        run: python -m optarena cases verify --language shell

  # F-17/F-13: hadolint catches Dockerfile anti-patterns (missing pins,
  # unnecessary layers, shell-form footguns) that a human reviewer skims past;
  # check_images_lock.py catches images.lock.json (F-13's build-reproducibility
  # ledger) silently drifting from what the Dockerfiles actually declare. Both
  # are static/no-Docker-daemon-needed, so this stays a fast PR-blocking job
  # rather than living only in the (Docker-build-heavy) publish workflow.
  dockerfile-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        context: [docker, docker/python, docker/node, docker/go, docker/jvm,
                   docker/rust, docker/dotnet, docker/php, docker/ruby]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: ${{ matrix.context }}/Dockerfile
          config: .hadolint.yaml

  # hadolint (above) checks Dockerfile *authoring* patterns; nothing
  # previously scanned the *built* image for actual CVEs in the OS/language
  # packages baked into it - the gap matters more than usual here because
  # these 9 images are published to a public registry (GHCR) and pulled
  # directly by users, not just used internally. Builds fresh (not pulled
  # from GHCR) so a PR's own Dockerfile changes are what gets scanned, not
  # whatever was last published - catching a newly-introduced vulnerable
  # package before it reaches production, not after.
  image-vuln-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # `name` exists purely for the artifact step below: GitHub Actions
      # expressions have no string-replace function, and artifact names
      # reject "/" (confirmed live: every context with a "/" - 8 of 9 legs -
      # failed "Upload SARIF as an artifact" outright, matrix.context itself
      # was never a safe name despite forward slash not looking like an
      # obviously-dangerous character).
      matrix:
        include:
          # `baseline` = the docker/vuln-baseline/<baseline>.json key (also
          # `image` minus its ":latest" tag) - kept as its own field rather
          # than derived in shell, since GitHub Actions expressions have no
          # string-replace function either (see the `name` comment below).
          - context: docker
            image: optarena-tester:latest
            baseline: optarena-tester
            name: base
          - context: docker/python
            image: optarena-tester-python:latest
            baseline: optarena-tester-python
            name: python
          - context: docker/node
            image: optarena-tester-node:latest
            baseline: optarena-tester-node
            name: node
          - context: docker/go
            image: optarena-tester-go:latest
            baseline: optarena-tester-go
            name: go
          - context: docker/jvm
            image: optarena-tester-jvm:latest
            baseline: optarena-tester-jvm
            name: jvm
          - context: docker/rust
            image: optarena-tester-rust:latest
            baseline: optarena-tester-rust
            name: rust
          - context: docker/dotnet
            image: optarena-tester-dotnet:latest
            baseline: optarena-tester-dotnet
            name: dotnet
          - context: docker/php
            image: optarena-tester-php:latest
            baseline: optarena-tester-php
            name: php
          - context: docker/ruby
            image: optarena-tester-ruby:latest
            baseline: optarena-tester-ruby
            name: ruby
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build the image
        run: docker build -t ${{ matrix.image }} -f ${{ matrix.context }}/Dockerfile ${{ matrix.context }}
      # SARIF: human-readable artifact for tracking (not the blocking gate).
      - name: Trivy vulnerability scan (SARIF, informational)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      # P1-03: JSON output feeds check_vuln_baseline.py, the ACTUAL gate -
      # exit-code left at Trivy's default (0) here so this step never fails
      # on its own; the baseline check step below is what blocks. A flat
      # `continue-on-error: true` (the previous state, blocking nothing at
      # all) is gone: docker/vuln-baseline/<image>.json - regenerated during
      # the 2026-08-02 remediation pass, which fixed 45% of the fleet's
      # CRITICAL/HIGH backlog (2508 -> 1367, verified by live scan, not
      # estimated: Go/PHP/.NET base images refreshed, Go additionally off an
      # EOL minor, apt-get upgrade added everywhere, an unused ImageMagick
      # suite removed from the Rust image) - records exactly what's already
      # been triaged and accepted (mostly Linux-kernel-header and
      # Debian-perl-tooling noise that can't affect a container's real
      # attack surface, confirmed not removable without breaking
      # build-essential/adduser respectively; see each baseline file's own
      # `note`). A genuinely NEW CRITICAL/HIGH finding - or the baseline
      # simply expiring, forcing periodic re-triage - fails this job.
      - name: Trivy vulnerability scan (JSON, for baseline check)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
      - name: Check against the accepted-vulnerability baseline
        run: python docker/check_vuln_baseline.py ${{ matrix.baseline }} trivy-results.json
      - name: Generate SBOM (CycloneDX)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: cyclonedx
          output: sbom-cyclonedx.json
      # Not a Security-tab upload (was, until confirmed 2026-08-02: both
      # org's repos have default_workflow_permissions locked to "read" at
      # the org level, greyed out in Settings with no way for a repo admin
      # to change it - a workflow's own `permissions:` block can only ever
      # narrow that ceiling, never widen it, so security-events: write can
      # never be granted here. That made this step a guaranteed failure on
      # every single run forever (confirmed: "Resource not accessible by
      # integration" on 100% of legs) - pure noise, not a real signal, once
      # the ceiling is confirmed permanent rather than a one-off. Findings
      # stay inspectable as a downloadable artifact instead; re-add the
      # Security-tab upload if the org ever flips that setting.
      - name: Upload SARIF + SBOM as artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # matrix.image contains ":" and matrix.context contains "/" -
          # both rejected by artifact-name validation (confirmed live for
          # the "/" case: every context with one failed outright). matrix.name
          # is a plain word, added to the matrix specifically for this.
          name: trivy-${{ matrix.name }}
          path: |
            trivy-results.sarif
            sbom-cyclonedx.json
          retention-days: 14

  # GitHub's own dependency-review-action, PR-only (it diffs the PR's
  # lockfile/manifest changes against a vulnerability database - there's
  # nothing to diff outside a PR). Complements Dependabot: Dependabot files
  # PRs for vulnerabilities in dependencies already merged, this blocks a PR
  # from introducing a new vulnerable dependency in the first place.
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  images-lock-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: docker/images.lock.json matches the Dockerfiles
        run: python docker/check_images_lock.py

  # F-17: `container_engine()` auto-detects and `OPTARENA_CONTAINER_ENGINE`
  # can force Podman (added this session), but no CI job had ever actually
  # run a check_command through a real Podman install - Docker-only coverage
  # meant a Podman-specific regression (CLI flag Docker accepts but Podman
  # doesn't, rootless permission/mount quirks) could only be caught by a
  # Podman user in the wild. `--language shell` scopes this to the base
  # image only (the 16 shell-tagged cases), not all ~9 per-language images -
  # deliberately narrow so this stays a fast per-PR job; verify-corpus
  # already covers full-corpus breadth under Docker.
  rootless-podman:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository_owner == 'trysti-labs' || github.repository_owner == 'selfopt'
    needs: unit-tests
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install rootless Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap
          podman info
      - name: Log in to GHCR (podman)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      # One retry, same reasoning as verify-corpus above - insurance against
      # a one-off infra flake, not a substitute for fixing a real regression.
      - name: Verify shell-language cases through Podman
        env:
          OPTARENA_CONTAINER_ENGINE: podman
        run: |
          for attempt in 1 2; do
            if python -m optarena cases verify --language shell; then
              exit 0
            fi
            echo "::warning::rootless-podman attempt $attempt failed"
            sleep 10
          done
          exit 1
