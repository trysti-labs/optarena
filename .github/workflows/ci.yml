name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff (lint gate)
        run: ruff check optarena tests

  # OS/Python matrix, and deliberately NO `python`-is-python3 shim: this is the
  # exact environment class the audit's original 5/75 failure lived in (a host
  # with python3 but no bare `python`). Catches that regression class plus
  # macOS/Windows host-fallback portability. Tests run without Docker.
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      # Node present so the cross-oracle conformance suite (tests/test_conformance.py)
      # runs instead of skipping - it's the H-09 guarantee that the Python and
      # JS oracles agree byte-for-byte.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Unit tests (no Docker)
        shell: bash
        run: OPTARENA_NO_DOCKER=1 python -m unittest discover tests -v

  # Corpus self-verification: every case's reference_solution must PASS the
  # real Docker-sandboxed oracle, every broken/unmodified variant must FAIL.
  # Runs when cases or the oracle change; images come from GHCR via the
  # tool's own pull fallback. Skipped on forks (no image pull access needed,
  # but keeps PR checks fast).
  verify-corpus:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'trysti-labs' || github.repository_owner == 'selfopt'
    needs: unit-tests
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # The sandbox images live on GHCR; login lets the tool's own pull
      # fallback fetch them even while the packages are private.
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify corpus (pulls sandbox images from GHCR on demand)
        run: python -m optarena cases verify
