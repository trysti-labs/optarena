# Build and publish the optarena-tester sandbox images to GHCR so first-run
# users `optarena docker pull` in minutes instead of building ~7GB locally.
# The tool's pull fallback (optarena/cases.py ensure_image) expects
# ghcr.io/trysti-labs/optarena/<local image name>:latest.
name: publish-images

on:
  push:
    branches: [main, v0.1]
    paths:
      - "docker/**"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # P1-03: keyless cosign signing and GitHub's own build-provenance
  # attestation both work by exchanging THIS token for a short-lived
  # signing certificate from Sigstore's Fulcio CA - no stored signing key,
  # no secret to rotate or leak. Neither step below needs anything else.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: base
            image: optarena-tester
            context: docker
          - lang: python
            image: optarena-tester-python
            context: docker/python
          - lang: node
            image: optarena-tester-node
            context: docker/node
          - lang: jvm
            image: optarena-tester-jvm
            context: docker/jvm
          - lang: go
            image: optarena-tester-go
            context: docker/go
          - lang: rust
            image: optarena-tester-rust
            context: docker/rust
          - lang: dotnet
            image: optarena-tester-dotnet
            context: docker/dotnet
          - lang: php
            image: optarena-tester-php
            context: docker/php
          - lang: ruby
            image: optarena-tester-ruby
            context: docker/ruby
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # F-14: images were built with plain `docker build` on the amd64
      # runner only, so anyone on an ARM64 host (Apple Silicon Docker
      # Desktop, ARM64 Podman) either paid QEMU emulation or couldn't use
      # the published images at all. QEMU registers the emulated
      # interpreters buildx needs to cross-build the arm64 half; the base
      # images and Dockerfile (see docker/Dockerfile's TARGETARCH-aware
      # terraform download) are otherwise already multi-arch-clean.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        run: |
          BASE=ghcr.io/trysti-labs/optarena/${{ matrix.image }}
          # :latest stays the default the tool's own pull fallback uses
          # (unchanged behaviour) - the immutable :<git-sha> tag alongside it
          # is what a CI run or a user's own scenario/CI config can pin to,
          # so "which exact image did this result come from" is always
          # answerable instead of resolving to whatever :latest happens to
          # be at pull time (Phase 2.3 - content-addressed images).
          #
          # --push (not build-then-push): buildx can't `docker load` a
          # multi-platform result into the local engine - a manifest list
          # spanning two platforms only exists once pushed to a registry.
          #
          # P1-03: --metadata-file captures the PUSHED digest so signing/
          # attestation below targets the exact immutable image this run
          # produced, not a mutable tag that could be repointed later.
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "$BASE:latest" -t "$BASE:${{ github.sha }}" \
            -f ${{ matrix.context }}/Dockerfile ${{ matrix.context }} \
            --push --metadata-file metadata.json
          echo "digest=$(jq -r '.["containerimage.digest"]' metadata.json)" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      # P1-03: SLSA build provenance - attests WHICH workflow run, commit,
      # and repo produced this exact image digest, published to GitHub's
      # own attestation store (visible on the package page) and, via
      # push-to-registry, alongside the image itself so `cosign
      # verify-attestation` (or any other Sigstore-aware client) can check
      # it without knowing to look on GitHub specifically.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.build.outputs.base }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # P1-03: a general-purpose Sigstore signature (separate from, and
      # more widely recognized by third-party tooling than, the GitHub-
      # specific attestation above) - keyless: cosign exchanges the
      # id-token above for a short-lived cert from Fulcio, signs with it,
      # and the signature + a transparency-log entry (Rekor) both get
      # published alongside the image. `--yes` skips the interactive
      # confirmation prompt this needs in a non-interactive CI shell.
      - name: Sign the image (keyless)
        run: cosign sign --yes "${{ steps.build.outputs.base }}@${{ steps.build.outputs.digest }}"
