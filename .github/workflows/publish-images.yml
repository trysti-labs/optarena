# Build and publish the optarena-tester sandbox images to GHCR so first-run
# users `optarena docker pull` in minutes instead of building ~7GB locally.
# The tool's pull fallback (optarena/cases.py ensure_image) expects
# ghcr.io/trysti-labs/optarena/<local image name>:latest.
name: publish-images

on:
  push:
    branches: [main, v0.1]
    paths:
      - "docker/**"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # P1-03: keyless cosign signing and GitHub's own build-provenance
  # attestation both work by exchanging THIS token for a short-lived
  # signing certificate from Sigstore's Fulcio CA - no stored signing key,
  # no secret to rotate or leak.
  id-token: write
  # `actions/attest-build-provenance` additionally needs this to persist
  # the attestation to GitHub's own attestation store via the REST API -
  # id-token alone (the OIDC exchange for the Fulcio cert) is not enough.
  # Missing this produced a real, live failure: "Failed to persist
  # attestation: Resource not accessible by integration" on every one of
  # the 9 matrix jobs in the first real run of this step, which then
  # skipped the cosign steps too (default `if: success()` step gating) -
  # confirmed via `gh run view`'s actual per-job conclusion (`failure`),
  # not just the misleading "Complete job: success" housekeeping step.
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: base
            image: optarena-tester
            context: docker
          - lang: python
            image: optarena-tester-python
            context: docker/python
          - lang: node
            image: optarena-tester-node
            context: docker/node
          - lang: jvm
            image: optarena-tester-jvm
            context: docker/jvm
          - lang: go
            image: optarena-tester-go
            context: docker/go
          - lang: rust
            image: optarena-tester-rust
            context: docker/rust
          - lang: dotnet
            image: optarena-tester-dotnet
            context: docker/dotnet
          - lang: php
            image: optarena-tester-php
            context: docker/php
          - lang: ruby
            image: optarena-tester-ruby
            context: docker/ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # F-14: images were built with plain `docker build` on the amd64
      # runner only, so anyone on an ARM64 host (Apple Silicon Docker
      # Desktop, ARM64 Podman) either paid QEMU emulation or couldn't use
      # the published images at all. QEMU registers the emulated
      # interpreters buildx needs to cross-build the arm64 half; the base
      # images and Dockerfile (see docker/Dockerfile's TARGETARCH-aware
      # terraform download) are otherwise already multi-arch-clean.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # P1-01: build+push ONLY the immutable :<git-sha> tag here - NOT
      # :latest. :latest is what the tool's own pull fallback
      # (optarena/_cases/_sandbox.py ensure_image) and `optarena sandbox
      # pull` resolve to by default, so it is the one tag that actually
      # matters for "did a vulnerable image reach users" - promoting it
      # only after the scan gate below passes means a deliberately
      # introduced new CRITICAL/HIGH finding can push an immutable
      # sha-tagged artifact (evidence trail) but can never move :latest.
      #
      # This two-step shape (push a staging tag, scan it, promote on pass)
      # is not a workaround: buildx can't `docker load` a multi-platform
      # result into the local engine at all (a manifest list spanning two
      # platforms only exists once pushed to a registry), so scanning
      # BEFORE any push is not an option here - the doc's own suggested
      # resolution ("push to a private/staging tag first and promote the
      # verified digest afterward") is the only shape that actually fits
      # buildx's multi-arch constraints.
      - name: Build and push (immutable digest tag only)
        id: build
        run: |
          BASE=ghcr.io/trysti-labs/optarena/${{ matrix.image }}
          # P1-03: --metadata-file captures the PUSHED digest so scanning,
          # signing, and attestation all target the exact immutable image
          # this run produced, not a mutable tag that could be repointed.
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "$BASE:${{ github.sha }}" \
            -f ${{ matrix.context }}/Dockerfile ${{ matrix.context }} \
            --push --metadata-file metadata.json
          echo "digest=$(jq -r '.["containerimage.digest"]' metadata.json)" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      # P1-01: scan the PUSHED digest directly from the registry - the exact
      # bits :latest would be promoted to below, not a separately-built copy
      # (ci.yml's own image-vuln-scan job builds its own local single-arch
      # image for PRs; that catches regressions early but says nothing about
      # THIS specific published artifact, which is the actual gap this
      # closes). `docker/login-action` above already wrote registry
      # credentials to the runner's docker config, which Trivy's default
      # image-scanning backend reuses automatically for a registry
      # reference. No explicit platform selection: this trivy-action version
      # (confirmed against its own action.yaml - v0.36.0 pinned above) has no
      # `platform` input at all; Trivy's own default multi-arch resolution
      # picks the runner's native platform (amd64 on ubuntu-latest), which
      # already matches what ci.yml's own PR-time scan builds and checks.
      - name: Trivy vulnerability scan (JSON, for baseline check)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.base }}@${{ steps.build.outputs.digest }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH

      # P1-01: the actual publish gate - a genuinely NEW CRITICAL/HIGH
      # finding (not already in docker/vuln-baseline/<image>.json) fails
      # this step, which stops every step below by default (`if:
      # success()`) - promotion, signing, and attestation never run, so
      # :latest never moves and no image described as "released" carries an
      # un-triaged finding. Reuses the exact same script/baseline files
      # ci.yml's own scan already gates on, so a PR and the real publish run
      # apply identical policy.
      - name: Check against the accepted-vulnerability baseline
        run: python docker/check_vuln_baseline.py ${{ matrix.image }} trivy-results.json

      # P1-01: promote the scanned digest to :latest only now that the gate
      # above passed. `imagetools create` re-tags the EXISTING manifest list
      # already pushed above - it does not rebuild, so the bits :latest
      # points at afterward are byte-identical to what was just scanned.
      - name: Promote to :latest (scan gate passed)
        run: |
          docker buildx imagetools create \
            -t "${{ steps.build.outputs.base }}:latest" \
            "${{ steps.build.outputs.base }}@${{ steps.build.outputs.digest }}"

      # P1-03: SLSA build provenance - attests WHICH workflow run, commit,
      # and repo produced this exact image digest, published to GitHub's
      # own attestation store (visible on the package page) and, via
      # push-to-registry, alongside the image itself so `cosign
      # verify-attestation` (or any other Sigstore-aware client) can check
      # it without knowing to look on GitHub specifically. Digest-based, so
      # it covers both the :<sha> and (now-promoted) :latest tags equally -
      # tag promotion order relative to this step doesn't matter.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.build.outputs.base }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # P1-03: a general-purpose Sigstore signature (separate from, and
      # more widely recognized by third-party tooling than, the GitHub-
      # specific attestation above) - keyless: cosign exchanges the
      # id-token above for a short-lived cert from Fulcio, signs with it,
      # and the signature + a transparency-log entry (Rekor) both get
      # published alongside the image. `--yes` skips the interactive
      # confirmation prompt this needs in a non-interactive CI shell.
      - name: Sign the image (keyless)
        run: cosign sign --yes "${{ steps.build.outputs.base }}@${{ steps.build.outputs.digest }}"
