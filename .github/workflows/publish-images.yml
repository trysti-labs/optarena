# Build and publish the optarena-tester sandbox images to GHCR so first-run
# users `optarena docker pull` in minutes instead of building ~7GB locally.
# The tool's pull fallback (optarena/cases.py ensure_image) expects
# ghcr.io/trysti-labs/optarena/<local image name>:latest.
name: publish-images

on:
  push:
    branches: [main, v0.1]
    paths:
      - "docker/**"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # P1-03: keyless cosign signing and GitHub's own build-provenance
  # attestation both work by exchanging THIS token for a short-lived
  # signing certificate from Sigstore's Fulcio CA - no stored signing key,
  # no secret to rotate or leak.
  id-token: write
  # `actions/attest-build-provenance` additionally needs this to persist
  # the attestation to GitHub's own attestation store via the REST API -
  # id-token alone (the OIDC exchange for the Fulcio cert) is not enough.
  # Missing this produced a real, live failure: "Failed to persist
  # attestation: Resource not accessible by integration" on every one of
  # the 9 matrix jobs in the first real run of this step, which then
  # skipped the cosign steps too (default `if: success()` step gating) -
  # confirmed via `gh run view`'s actual per-job conclusion (`failure`),
  # not just the misleading "Complete job: success" housekeeping step.
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: base
            image: optarena-tester
            context: docker
          - lang: python
            image: optarena-tester-python
            context: docker/python
          - lang: node
            image: optarena-tester-node
            context: docker/node
          - lang: jvm
            image: optarena-tester-jvm
            context: docker/jvm
          - lang: go
            image: optarena-tester-go
            context: docker/go
          - lang: rust
            image: optarena-tester-rust
            context: docker/rust
          - lang: dotnet
            image: optarena-tester-dotnet
            context: docker/dotnet
          - lang: php
            image: optarena-tester-php
            context: docker/php
          - lang: ruby
            image: optarena-tester-ruby
            context: docker/ruby
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # F-14: images were built with plain `docker build` on the amd64
      # runner only, so anyone on an ARM64 host (Apple Silicon Docker
      # Desktop, ARM64 Podman) either paid QEMU emulation or couldn't use
      # the published images at all. QEMU registers the emulated
      # interpreters buildx needs to cross-build the arm64 half; the base
      # images and Dockerfile (see docker/Dockerfile's TARGETARCH-aware
      # terraform download) are otherwise already multi-arch-clean.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # P1-08: install the raw Trivy CLI (the same binary trivy-action
      # itself wraps internally, confirmed by reading its action.yaml) so
      # each platform's scan below can pass an explicit `--platform`. This
      # is needed because P1-08's own root cause is that the trivy-action
      # composite action's action.yaml (checked directly against the exact
      # pinned commit ci.yml/this file already use) has NO `platform` input
      # at all - Trivy's own default multi-arch resolution silently picks
      # the runner's native platform (amd64) when given an ambiguous
      # manifest list, and the action gives no way to override that.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
      # P1-01/P1-08: build+push EACH platform to its own immutable
      # :<git-sha>-<arch> tag independently - NOT a combined multi-arch
      # manifest yet, and NOT :latest. Building each platform separately
      # (rather than `--platform linux/amd64,linux/arm64` in one
      # invocation) makes each pushed digest genuinely single-platform, so
      # the scan below of THAT specific digest is unambiguous - confirmed
      # live that Trivy's default resolution actually fails outright
      # ("no child with platform linux/amd64 in index") when asked to scan
      # an arm64-only push without an explicit --platform, which is the
      # exact ambiguity this restructuring removes at the source rather
      # than patching around.
      - name: Build and push amd64
        id: build-amd64
        run: |
          BASE=ghcr.io/trysti-labs/optarena/${{ matrix.image }}
          docker buildx build --platform linux/amd64 \
            -t "$BASE:${{ github.sha }}-amd64" \
            -f ${{ matrix.context }}/Dockerfile ${{ matrix.context }} \
            --push --metadata-file metadata-amd64.json
          echo "digest=$(jq -r '.["containerimage.digest"]' metadata-amd64.json)" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Build and push arm64
        id: build-arm64
        run: |
          BASE=ghcr.io/trysti-labs/optarena/${{ matrix.image }}
          docker buildx build --platform linux/arm64 \
            -t "$BASE:${{ github.sha }}-arm64" \
            -f ${{ matrix.context }}/Dockerfile ${{ matrix.context }} \
            --push --metadata-file metadata-arm64.json
          echo "digest=$(jq -r '.["containerimage.digest"]' metadata-arm64.json)" >> "$GITHUB_OUTPUT"

      # P1-08: scan each platform's own pushed digest, with the platform
      # made explicit rather than relying on default resolution - verified
      # live that this is what actually makes the arm64 scan work at all
      # (buildx attaches a build-provenance attestation manifest even to a
      # nominally single-platform push, so the pushed ref is still an
      # index, not a bare single manifest - `--platform` is required, not
      # merely defensive).
      - name: Scan the amd64 digest
        run: |
          trivy image --platform linux/amd64 --format json \
            --output trivy-amd64.json --severity CRITICAL,HIGH \
            "${{ steps.build-amd64.outputs.base }}@${{ steps.build-amd64.outputs.digest }}"

      - name: Scan the arm64 digest
        run: |
          trivy image --platform linux/arm64 --format json \
            --output trivy-arm64.json --severity CRITICAL,HIGH \
            "${{ steps.build-amd64.outputs.base }}@${{ steps.build-arm64.outputs.digest }}"

      # P1-01/P1-08: the actual publish gate, run once per platform - a
      # genuinely NEW CRITICAL/HIGH finding on EITHER architecture (not
      # already in docker/vuln-baseline/<image>.json) fails this step,
      # which stops every step below by default (`if: success()`) -
      # combining, promotion, signing, and attestation never run, so
      # :latest never moves and no image described as "released" carries
      # an un-triaged finding on either platform. Reuses the exact same
      # script/baseline files ci.yml's own scan already gates on.
      - name: Check the amd64 scan against the accepted-vulnerability baseline
        run: python docker/check_vuln_baseline.py ${{ matrix.image }} trivy-amd64.json

      - name: Check the arm64 scan against the accepted-vulnerability baseline
        run: python docker/check_vuln_baseline.py ${{ matrix.image }} trivy-arm64.json

      # P1-08: combine the two independently-scanned digests into one real
      # multi-arch manifest list - `imagetools create` re-tags/merges the
      # EXISTING pushed digests, it does not rebuild, so the combined
      # image's bits are byte-identical to what was just scanned on each
      # platform. Still NOT :latest - that promotion is now the LAST step,
      # after signing and attestation both succeed against this combined
      # digest, not before (the other half of P1-08: a failed sign/attest
      # must never leave :latest already pointing at this digest).
      - name: Combine into a multi-arch manifest (not yet :latest)
        id: combine
        run: |
          BASE=${{ steps.build-amd64.outputs.base }}
          docker buildx imagetools create \
            -t "$BASE:${{ github.sha }}" \
            "$BASE@${{ steps.build-amd64.outputs.digest }}" \
            "$BASE@${{ steps.build-arm64.outputs.digest }}"
          DIGEST=$(docker buildx imagetools inspect "$BASE:${{ github.sha }}" | awk '/^Digest:/{print $2}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      # P1-03: SLSA build provenance - attests WHICH workflow run, commit,
      # and repo produced this exact combined multi-arch image digest,
      # published to GitHub's own attestation store (visible on the
      # package page) and, via push-to-registry, alongside the image
      # itself so `cosign verify-attestation` (or any other Sigstore-aware
      # client) can check it without knowing to look on GitHub
      # specifically.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.combine.outputs.base }}
          subject-digest: ${{ steps.combine.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # P1-03: a general-purpose Sigstore signature (separate from, and
      # more widely recognized by third-party tooling than, the GitHub-
      # specific attestation above) - keyless: cosign exchanges the
      # id-token above for a short-lived cert from Fulcio, signs with it,
      # and the signature + a transparency-log entry (Rekor) both get
      # published alongside the image. `--yes` skips the interactive
      # confirmation prompt this needs in a non-interactive CI shell.
      - name: Sign the image (keyless)
        run: cosign sign --yes "${{ steps.combine.outputs.base }}@${{ steps.combine.outputs.digest }}"

      # P1-08: promotion is now the LAST step in the job, after the scan
      # gate on both platforms AND signing AND attestation have all
      # already succeeded - a failure in any earlier step (default `if:
      # success()`) means :latest simply never moves, instead of the
      # previous ordering where a signing/attestation failure could leave
      # :latest already pointing at a digest the job never finished
      # vetting. `imagetools create` re-tags the already-combined,
      # already-signed manifest list - it does not rebuild, so :latest
      # ends up byte-identical to what was just signed.
      - name: Promote to :latest (scanned, signed, and attested)
        run: |
          docker buildx imagetools create \
            -t "${{ steps.combine.outputs.base }}:latest" \
            "${{ steps.combine.outputs.base }}@${{ steps.combine.outputs.digest }}"
