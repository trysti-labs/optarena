apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webstore-api
  namespace: webstore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: webstore-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
